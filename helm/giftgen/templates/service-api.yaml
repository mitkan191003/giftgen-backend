apiVersion: v1
kind: Service
metadata:
  name: {{ include "giftgen.fullname" . }}-api
  labels:
    {{- include "giftgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "giftgen.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP

