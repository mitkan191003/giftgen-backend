{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "giftgen.fullname" . }}-migrations
  labels:
    {{- include "giftgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "giftgen.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "giftgen.serviceAccountName" . }}
      containers:
        - name: migrations
          image: {{ include "giftgen.migrationsImage" . }}
          imagePullPolicy: {{ default .Values.api.image.pullPolicy .Values.migrations.image.pullPolicy }}
          {{- if .Values.migrations.command }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          {{- else }}
          command:
            - alembic
            - upgrade
            - head
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "giftgen.fullname" . }}-config
          {{- with .Values.migrations.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

